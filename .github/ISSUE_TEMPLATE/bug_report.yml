name: Bug report / 问题反馈
description: Report a reproducible problem with PhotoCollection.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Remove API keys, private paths and personal metadata. / 请移除密钥、私人路径和个人信息。
  - type: input
    id: version
    attributes:
      label: Version and environment / 版本与环境
      placeholder: "2.5.1, Windows 11, desktop or local web"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result / 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized error / 实际结果与脱敏错误
    validations:
      required: true
