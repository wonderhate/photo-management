name: Windows release files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PHOTO_AUTOLOAD_AI: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the existing draft
        shell: pwsh
        run: |
          $version=python -c "from backend.version import VERSION; print(VERSION)"
          $tag="v$version"
          if ((gh release view $tag --json isDraft --jq .isDraft) -ne 'true') { throw 'Only an existing draft may receive rebuilt files.' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Install the existing build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { throw 'CPU torch installation failed.' }
          ./.venv/Scripts/python.exe -m pip install -r backend/requirements.txt -r backend/requirements-ai.txt -r backend/requirements-faces.txt -r desktop/requirements.txt
          if ($LASTEXITCODE) { throw 'Build dependencies failed.' }
          npm ci --prefix frontend
          if ($LASTEXITCODE) { throw 'Frontend dependencies failed.' }
      - name: Install the pinned installer translation
        shell: pwsh
        run: |
          $language='C:/Program Files (x86)/Inno Setup 6/Languages/ChineseSimplified.isl'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/347bf29bc619ca8a644e05ff22879df5c5e5e5ff/Files/Languages/ChineseSimplified.isl' -OutFile $language
          if ((Get-FileHash -LiteralPath $language -Algorithm SHA256).Hash.ToLower() -ne 'e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d') { throw 'Installer translation integrity verification failed.' }
      - name: Build and verify the Windows package
        shell: pwsh
        run: |
          ./build-windows.ps1 -SkipDependencies
          if ($LASTEXITCODE) { throw 'Windows package failed.' }
          ./.venv/Scripts/python.exe -m unittest desktop.test_icon
          if ($LASTEXITCODE) { throw 'Web icon verification failed.' }
          ./.venv/Scripts/python.exe -m desktop.verify_package releases/windows/PhotoCollection/PhotoCollection.exe
          if ($LASTEXITCODE) { throw 'Packaged local application verification failed.' }
          ./build-installer.ps1
      - name: Upload the verified files to the draft
        shell: pwsh
        run: |
          $version=./.venv/Scripts/python.exe -c "from backend.version import VERSION; print(VERSION)"
          $files=@('PhotoCollection-Windows.zip',"PhotoCollection-Setup-$version-x64.exe")
          $hashes=$files | ForEach-Object { $hash=Get-FileHash -LiteralPath "releases/$_" -Algorithm SHA256; "$($hash.Hash.ToLower())  $_" }
          [IO.File]::WriteAllText((Join-Path $PWD 'releases/SHA256SUMS.txt'),($hashes -join "`n")+"`n",[Text.UTF8Encoding]::new($false))
          gh release upload $env:RELEASE_TAG "releases/PhotoCollection-Setup-$version-x64.exe" releases/PhotoCollection-Windows.zip releases/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { throw 'Draft upload failed.' }
