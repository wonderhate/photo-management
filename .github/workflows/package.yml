name: Web package
on:
  push:
    branches: [main, 'codex/web-package']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and load for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: photo-management:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the actual image and read-only originals
        run: |
          mkdir -p verification/container-originals
          docker run -d --name photo-test -p 127.0.0.1:8000:8000 --mount "type=bind,source=$PWD/verification/container-originals,target=/photos,readonly" photo-management:verify
          trap 'docker logs photo-test; docker rm -f photo-test' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          docker exec photo-test python -c "from PIL import Image; Image.new('RGB',(640,480),'orange').save('/data/package-test.jpg')"
          docker cp photo-test:/data/package-test.jpg verification/container-originals/source.jpg
          python - <<'PY'
          import hashlib,json,urllib.request,time
          def api(path,body=None):
              req=urllib.request.Request('http://127.0.0.1:8000'+path,data=json.dumps(body).encode() if body is not None else None,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as response:return json.load(response)
          job=api('/api/photos/import',{'paths':['/photos/source.jpg']})
          for _ in range(100):
              state=api('/api/jobs/'+job['id'])
              if state['status'] in ('completed','failed'):break
              time.sleep(.1)
          assert state['status']=='completed',state
          photo=api('/api/photos')['photos'][0]
          with urllib.request.urlopen('http://127.0.0.1:8000/api/photos/'+photo['id']+'/original') as response:before=hashlib.sha256(response.read()).hexdigest()
          draft=api('/api/watermark/drafts',{'photo_id':photo['id'],'settings_json':{'template':'ambient'}})
          assert api('/api/watermark/drafts/'+draft['id']+'/export',{'format':'png'})
          with urllib.request.urlopen('http://127.0.0.1:8000/api/photos/'+photo['id']+'/original') as response:assert hashlib.sha256(response.read()).hexdigest()==before
          with urllib.request.urlopen('http://127.0.0.1:8000/') as response:assert "frame-ancestors 'none'" in response.headers['Content-Security-Policy']
          print('Actual container: import, preview, draft, export, source hash and CSP PASS')
          PY
          docker exec photo-test test -z "$(docker exec photo-test find /app -name library-config.json -o -name library.db -o -name '*.p12')"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(docker run --rm photo-management:verify python -c 'from backend.version import VERSION; print(VERSION)')
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag photo-management:verify "$image:$version"
          docker tag photo-management:verify "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
          echo "Published $image:$version" >> "$GITHUB_STEP_SUMMARY"
