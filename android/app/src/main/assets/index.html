<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>光影集 · 连接电脑</title><link rel="stylesheet" href="app.css"></head>
<body><main><header><span class="mark">◎</span><span>光影集 <small>你的摄影空间</small></span></header><div class="hero"><span class="eyebrow">LIGHT, ALWAYS WITH YOU</span><h1>照片在电脑，<br>灵感随身。</h1><p>连接你的照片库，继续整理与创作。</p></div><section><div class="section-title"><span class="computer">▣</span><div><h2>连接我的电脑</h2><p>电脑与手机连接同一 Wi-Fi 或私有 VPN</p></div></div><label>电脑地址<input id="address" type="url" inputmode="url" placeholder="http://192.168.1.20:8000" autocomplete="off"></label><label>八位配对码<input id="code" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="在电脑「设置 · 手机远程访问」查看" autocomplete="off"></label><button id="pair">配对并进入照片库 <span>→</span></button><button class="secondary" id="resume">连接已配对的电脑</button><p id="error" role="status"></p></section><div class="principles"><p><b>01</b><span>所有整理与草稿保存在电脑</span></p><p><b>02</b><span>手机只缓存索引，预览不占磁盘</span></p><p><b>03</b><span>点击导出，水印才保存到手机相册</span></p></div><footer>收集光，也收藏看见的方式。</footer></main><script src="app.js"></script></body></html>
