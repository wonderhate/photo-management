<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>光影集 · 连接电脑</title><link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header><div class="brand"><img src="brand-icon.png" width="36" height="36" alt=""><div><b data-i18n="brand">光影集</b><small data-i18n="space">你的摄影空间</small></div></div><button id="language" class="quiet" type="button" aria-label="切换界面语言">EN</button></header>
    <div class="hero"><span class="eyebrow">YOUR PERSONAL PHOTO ARCHIVE</span><h1><span data-i18n="hero1">照片在电脑，</span><br><span data-i18n="hero2">灵感随身。</span></h1><p data-i18n="intro">连接你的照片库，让整理与创作接续发生。</p><span class="hero-line"></span></div>
    <section aria-labelledby="connect-title">
      <div class="section-title"><span class="step">01</span><div><h2 id="connect-title" data-i18n="connect">连接我的电脑</h2><p data-i18n="network">手机与电脑连接同一 Wi-Fi 或私有 VPN</p></div></div>
      <label><span data-i18n="address">电脑地址</span><input id="address" type="url" inputmode="url" placeholder="http://192.168.1.20:8000" autocomplete="off" spellcheck="false"></label>
      <label><span data-i18n="code">八位配对码</span><input id="code" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="在电脑「设置 · 手机远程访问」查看" autocomplete="off"></label>
      <p class="field-help" data-i18n="help">在电脑配对界面查看以上两项，完整填写地址和端口。</p>
      <button id="pair" type="button"><span data-i18n="pair">配对并进入照片库</span><span aria-hidden="true">↗</span></button>
      <button id="resume" class="secondary" type="button" data-i18n="resume">连接已配对的电脑</button>
      <p id="error" role="status" aria-live="polite"></p>
    </section>
    <div class="principles"><p><b>02</b><span data-i18n="desktop">整理与草稿保存在电脑</span></p><p><b>03</b><span data-i18n="index">手机仅缓存索引，预览不存入磁盘</span></p><p><b>04</b><span data-i18n="export">正式导出，才保存到手机相册</span></p></div>
    <footer data-i18n="slogan">收集光，收藏爱</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
