plugins { id 'com.android.application' }

android {
    namespace 'com.wonder.photo'
    compileSdk 35
    defaultConfig { applicationId 'com.wonder.photo'; minSdk 29; targetSdk 35; versionCode 3; versionName '2.0.1'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint {
        warningsAsErrors = true
        // Pinned dependencies and API 35 are intentional, tested release inputs.
        // ponytail: raise target/versions with compatibility tests before a Play Store release.
        disable 'OldTargetApi', 'GradleDependency'
        textReport = true
        textOutput = file("$buildDir/reports/lint-current.txt")
    }
    signingConfigs {
        release {
            if (System.getenv('PHOTO_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('PHOTO_ANDROID_KEYSTORE'))
                storePassword System.getenv('PHOTO_ANDROID_STORE_PASSWORD')
                keyAlias 'photo-collection'
                keyPassword System.getenv('PHOTO_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
